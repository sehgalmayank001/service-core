plugins:
  - rubocop-rake

require:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "gemfiles/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

# Per project style, frozen_string_literal magic comments are not used.
Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/VerifiedDoubleReference:
  Enabled: false

# add_error_and_validate is part of the public API and intentionally returns
# the boolean result of valid?, but its name describes the action it performs.
Naming/PredicateMethod:
  AllowedMethods:
    - add_error_and_validate